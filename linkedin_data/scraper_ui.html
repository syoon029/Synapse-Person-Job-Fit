<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Posting CSV Generator</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use Inter font */
        body {
            font-family: "Inter", sans-serif;
        }
        /* Custom style for textarea to make it look like other inputs */
        textarea {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
            Job Posting CSV Generator
        </h1>

        <!-- Main Content: Form + Table -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Column 1: Data Entry Form -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold text-gray-700 mb-5">1. Add New Job Posting</h2>
                
                <!-- This form won't reload the page -->
                <form id="job-form" class="space-y-4">
                    
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700">posting.title</label>
                        <input type="text" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border">
                    </div>

                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700">posting.company_name</label>
                        <input type="text" id="company" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border">
                    </div>

                    <div>
                        <label for="skills" class="block text-sm font-medium text-gray-700">posting.skills_desc</label>
                        <textarea id="skills" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" placeholder="e.g., Python, React, SQL, AWS"></textarea>
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-medium text-gray-700">posting.description</label>
                        <textarea id="description" rows="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" placeholder="Copy-paste the full job description here..."></textarea>
                    </div>

                    <div>
                        <label for="exp_level" class="block text-sm font-medium text-gray-700">posting.formatted_experience_level</label>
                        <input type="text" id="exp_level" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" placeholder="e.g., Entry level, Mid-Senior level">
                    </div>

                    <div>
                        <label for="location" class="block text-sm font-medium text-gray-700">posting.location</label>
                        <input type="text" id="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2.5 border" placeholder="e.g., New York, NY or Remote">
                    </div>

                    <!-- Add Job Button -->
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                        Add Job to Table
                    </button>
                    
                    <!-- Message Box -->
                    <div id="message-box" class="hidden text-center text-sm p-3 rounded-md"></div>

                </form>
            </div>
            
            <!-- Column 2: Data Table and Export -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5">
                    <h2 class="text-2xl font-semibold text-gray-700">2. Review Data</h2>
                    <!-- Download CSV Button -->
                    <button id="download-btn" class="w-full md:w-auto mt-3 md:mt-0 bg-green-600 text-white font-semibold py-2.5 px-5 rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
                        Download CSV
                    </button>
                </div>
                
                <!-- Table to show added data -->
                <div class="overflow-x-auto">
                    <div class="min-w-full inline-block align-middle">
                        <div class="border rounded-lg overflow-hidden">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Company</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="job-table-body" class="divide-y divide-gray-200 bg-white">
                                    <!-- Rows will be added here by JavaScript -->
                                    <tr>
                                        <td colspan="4" class="px-4 py-4 text-sm text-gray-500 text-center">No jobs added yet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. State and Selectors ---
        let jobs = [];
        let jobIdCounter = 0; // This will be our internal ID for deletion

        const form = document.getElementById('job-form');
        const tableBody = document.getElementById('job-table-body');
        const downloadBtn = document.getElementById('download-btn');
        const messageBox = document.getElementById('message-box');
        
        // Input fields
        const titleInput = document.getElementById('title');
        const companyInput = document.getElementById('company');
        const skillsInput = document.getElementById('skills');
        const descriptionInput = document.getElementById('description');
        const expLevelInput = document.getElementById('exp_level');
        const locationInput = document.getElementById('location');

        // --- 2. Event Listeners ---
        
        /**
         * Handle form submission to add a new job
         */
        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from reloading
            
            const jobData = {
                // Internal ID for managing the row
                id: jobIdCounter++, 
                // Data for the CSV
                'posting.title': titleInput.value,
                'posting.company_name': companyInput.value,
                'posting.skills_desc': skillsInput.value,
                'posting.description': descriptionInput.value,
                'posting.formatted_experience_level': expLevelInput.value,
                'posting.location': locationInput.value,
            };

            // Add to our main jobs array
            jobs.push(jobData);

            // Update the UI
            renderTable();
            form.reset(); // Clear the form
            
            // Show success message
            showMessage('Job added successfully!', 'success');
        });

        /**
         * Handle download button click
         */
        downloadBtn.addEventListener('click', () => {
            if (jobs.length === 0) {
                // We can't use alert(), so we show a message
                showMessage('No jobs to download. Please add at least one job.', 'error');
                return;
            }
            downloadCSV(jobs);
        });

        // --- 3. Core Functions ---

        /**
         * Re-draws the HTML table based on the 'jobs' array
         */
        function renderTable() {
            // Clear the table
            tableBody.innerHTML = '';

            if (jobs.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-4 py-4 text-sm text-gray-500 text-center">No jobs added yet.</td></tr>';
                return;
            }

            // Add each job as a row
            jobs.forEach(job => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', job.id); // Set data-id for deletion
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-900">${escapeHTML(job['posting.title'])}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${escapeHTML(job['posting.company_name'])}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${escapeHTML(job['posting.location'])}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium">
                        <button onclick="deleteJob(${job.id})" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }
        
        /**
         * Deletes a job from the 'jobs' array and re-renders the table
         */
        function deleteJob(id) {
            // Find the job by its internal ID and remove it
            jobs = jobs.filter(job => job.id !== id);
            renderTable();
            showMessage('Job removed.', 'error');
        }

        /**
         * Generates and triggers a download for the CSV file
         */
        function downloadCSV(data) {
            // These are the exact headers you requested
            const headers = [
                'posting.title',
                'posting.company_name',
                'posting.skills_desc',
                'posting.description',
                'posting.formatted_experience_level',
                'posting.location'
            ];

            // Use the helper function to escape and quote headers
            let csvContent = headers.map(escapeCSVValue).join(',') + '\n';

            // Process each job row
            data.forEach(job => {
                const row = headers.map(header => {
                    const value = job[header];
                    return escapeCSVValue(value);
                });
                csvContent += row.join(',') + '\n';
            });

            // Create a file blob
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            
            // Create a hidden link to trigger the download
            const link = document.createElement('a');
            if (link.download !== undefined) { // Check for browser support
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'job_postings.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }
        
        /**
         * Safely escapes a value for a CSV cell.
         * 1. Converts to string.
         * 2. Escapes double-quotes by doubling them ("" -> """").
         * 3. Wraps the entire value in double-quotes.
         */
        function escapeCSVValue(value) {
            const strValue = String(value == null ? '' : value);
            // Replace any quote with two quotes
            const escapedValue = strValue.replace(/"/g, '""');
            // Wrap the whole thing in quotes
            return `"${escapedValue}"`;
        }
        
        /**
         * Simple function to prevent HTML injection in the table
         */
        function escapeHTML(str) {
            return str.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        
        /**
         * Shows a temporary message to the user
         */
        function showMessage(message, type = 'success') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-700');
            } else {
                messageBox.classList.add('bg-red-100', 'text-red-700');
            }
            
            // Hide the message after 3 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000);
        }

    </script>
</body>
</html>
